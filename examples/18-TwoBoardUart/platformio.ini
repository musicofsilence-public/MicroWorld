[platformio]
; Two role environments, symmetric firmware; build both by default so the
; compile gate covers each. Roles differ only by a -D compile definition —
; never build_src_filter, which ESP-IDF ignores.
default_envs = esp32-s3-node-a, esp32-s3-node-b

; Every example links the full MicroWorld stack through the same symlink://
; wiring the verified consumer project uses; the linker keeps only what the
; example calls, so unused layers cost flash-image nothing at runtime.
[microworld]
lib_deps =
    symlink://../../Modules
    symlink://../../Modules/MicroWorld/Platform/Esp32
lib_ldf_mode = chain+
build_flags =
    -std=gnu++17

; Board settings shared by both role environments (each role defined once).
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
lib_deps = ${microworld.lib_deps}
lib_ldf_mode = ${microworld.lib_ldf_mode}
board_build.partitions = ../esp32-common/partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="../esp32-common/sdkconfig.defaults"

[env:esp32-s3-node-a]
build_flags = ${microworld.build_flags} -DMICROWORLD_EXAMPLE_NODE_ID=1

[env:esp32-s3-node-b]
build_flags = ${microworld.build_flags} -DMICROWORLD_EXAMPLE_NODE_ID=2
