[platformio]
default_envs = native

# The single portable package (Modules/) now carries every system — Core,
# Engine, Messaging, Transport (incl. RadioE32), Networking, Application — and
# the Esp32 platform edge is its own library at MicroWorld/Platform/Esp32. From
# this directory ../../.. resolves to Modules/, so every profile links the
# portable package and the Esp32 profile adds the platform library.
[microworld_core]
lib_deps = symlink://../../..
lib_ldf_mode = chain+
build_flags =
    -std=gnu++17

[microworld_object]
lib_deps = ${microworld_core.lib_deps}
lib_ldf_mode = chain+
build_flags = ${microworld_core.build_flags}

[microworld_engine]
lib_deps = ${microworld_core.lib_deps}
lib_ldf_mode = chain+
build_flags = ${microworld_core.build_flags}

[microworld_transport]
lib_deps = ${microworld_core.lib_deps}
lib_ldf_mode = chain+
build_flags = ${microworld_core.build_flags}

[microworld_platform_esp32]
lib_deps =
    ${microworld_core.lib_deps}
    symlink://../../../MicroWorld/Platform/Esp32
lib_ldf_mode = chain+
build_flags = ${microworld_core.build_flags}

[microworld_radio_e32]
lib_deps = ${microworld_core.lib_deps}

[microworld_platform_esp32_radio_e32]
lib_deps = ${microworld_platform_esp32.lib_deps}
lib_ldf_mode = ${microworld_platform_esp32.lib_ldf_mode}
build_flags = ${microworld_platform_esp32.build_flags}

[esp32_target]
partitions = ../../../../examples/esp32-common/partitions.csv
flash_mode = qio
flash_frequency = 80000000L
flash_size = 16MB
maximum_size = 16777216
cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="../../../../examples/esp32-common/sdkconfig.defaults"

[env:native]
platform = native
lib_deps = ${microworld_core.lib_deps}
lib_ldf_mode = ${microworld_core.lib_ldf_mode}
build_flags =
    ${microworld_core.build_flags}
    -fno-exceptions
    -fno-rtti
build_src_filter =
    +<NativeMain.cpp>
    -<Esp32Main.cpp>
    -<Esp32BenchmarkMain.cpp>
    -<MemoryNativeMain.cpp>
    -<MemoryEsp32Main.cpp>
    -<ObjectNativeMain.cpp>
    -<ObjectEsp32Main.cpp>
    -<EngineNativeMain.cpp>
    -<EngineEsp32Main.cpp>
    -<NetNativeMain.cpp>
    -<NetEsp32Main.cpp>
    -<PlatformEsp32Main.cpp>
    -<PlatformEsp32RadioE32Main.cpp>

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
lib_deps = ${microworld_core.lib_deps}
lib_ldf_mode = ${microworld_core.lib_ldf_mode}
build_flags = ${microworld_core.build_flags}
build_src_filter = -<PlatformEsp32RadioE32Main.cpp>
board_build.partitions = ${esp32_target.partitions}
board_build.flash_mode = ${esp32_target.flash_mode}
board_build.f_flash = ${esp32_target.flash_frequency}
board_upload.flash_size = ${esp32_target.flash_size}
board_upload.maximum_size = ${esp32_target.maximum_size}
board_build.cmake_extra_args = ${esp32_target.cmake_extra_args}

[env:esp32-s3-memory]
